<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Ciências – Litosfera e Rochas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --fs-title:        clamp(1.6rem, 5vw, 3rem);
    --fs-sub:          clamp(1rem, 3vw, 1.5rem);
    --fs-topic:        clamp(0.75rem, 2vw, 1rem);
    --fs-question:     clamp(1.1rem, 3.2vw, 1.85rem);
    --fs-option:       clamp(1rem, 2.6vw, 1.45rem);
    --fs-feedback:     clamp(0.9rem, 2.2vw, 1.25rem);
    --fs-btn:          clamp(1rem, 2.8vw, 1.6rem);
    --fs-counter:      clamp(0.85rem, 2vw, 1.1rem);
    --fs-score:        clamp(3rem, 10vw, 5rem);
    --fs-result-title: clamp(1.4rem, 4vw, 2.4rem);
    --fs-stars:        clamp(1.8rem, 5vw, 2.5rem);
    --card-pad:        clamp(20px, 4vw, 48px);
    --gap:             clamp(10px, 2vw, 16px);
    --letter-size:     clamp(34px, 6vw, 44px);
    --green-dark: #2d6a4f;
    --green-mid: #52b788;
    --green-light: #d8f3dc;
    --yellow: #f4d03f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1b2b22 0%, #2d6a4f 60%, #52b788 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px 0;
  }

  /* ── TELA INICIAL ── */
  #screen-start {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    gap: clamp(14px, 3vw, 22px);
    padding: 40px 20px;
    width: 100%;
    max-width: min(980px, 100%);
  }

  .start-emoji {
    font-size: clamp(4rem, 12vw, 7rem);
    animation: float 3s ease-in-out infinite;
    line-height: 1;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50%       { transform: translateY(-14px); }
  }

  .start-title {
    font-family: 'Playfair Display', serif;
    font-size: var(--fs-title);
    color: #fff;
    line-height: 1.15;
    text-shadow: 0 2px 16px rgba(0,0,0,0.22);
  }

  .start-sub {
    font-size: var(--fs-sub);
    font-weight: 700;
    color: rgba(255,255,255,0.88);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .pills-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 4px;
  }

  .pill {
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: clamp(0.78rem, 2.2vw, 1rem);
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 50px;
    backdrop-filter: blur(4px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .start-teacher {
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: rgba(255,255,255,0.6);
    font-weight: 400;
  }

  /* ── BARRA DE PROGRESSO ── */
  #progress-bar-area {
    display: none;
    width: 100%;
    max-width: min(980px, 100%);
    padding: clamp(16px, 3vw, 28px) clamp(12px, 3vw, 28px) 0;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .progress-meta span {
    font-size: var(--fs-counter);
    font-weight: 700;
    color: rgba(255,255,255,0.92);
  }

  .progress-track {
    width: 100%;
    height: clamp(8px, 1.5vw, 12px);
    background: rgba(255,255,255,0.18);
    border-radius: 50px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 50px;
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  /* ── CARD DE QUESTÃO ── */
  #screen-quiz {
    display: none;
    width: 100%;
    max-width: min(980px, 100%);
    padding: clamp(14px, 3vw, 28px) clamp(12px, 3vw, 28px) 0;
  }

  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(44,106,79,0.13);
    padding: var(--card-pad);
  }

  .topic-label {
    font-size: var(--fs-topic);
    font-weight: 900;
    color: var(--green-dark);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: clamp(10px, 2vw, 16px);
  }

  .question-text {
    font-size: var(--fs-question);
    font-weight: 700;
    color: #1a2e1f;
    line-height: 1.45;
    margin-bottom: clamp(16px, 3vw, 28px);
  }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--gap);
    margin-bottom: clamp(16px, 3vw, 24px);
  }

  @media (min-width: 640px) {
    .options-grid { grid-template-columns: 1fr 1fr; }
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 14px);
    background: var(--green-light);
    border: 2.5px solid transparent;
    border-radius: 14px;
    padding: clamp(10px, 2vw, 14px) clamp(12px, 2vw, 18px);
    cursor: pointer;
    text-align: left;
    transition: background 0.22s, border-color 0.22s, transform 0.15s;
    font-family: 'Nunito', sans-serif;
  }

  .option-btn:hover:not(.selected) {
    background: #c3e6cb;
    transform: translateY(-2px);
  }

  .option-btn.selected {
    background: #b7e4c7;
    border-color: #52b788;
    cursor: default;
  }

  .letter-circle {
    min-width: var(--letter-size);
    width: var(--letter-size);
    height: var(--letter-size);
    border-radius: 50%;
    background: var(--green-dark);
    color: #fff;
    font-size: clamp(0.85rem, 2.2vw, 1.15rem);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .option-btn.selected .letter-circle {
    background: #1a6638;
  }

  .option-text {
    font-size: var(--fs-option);
    font-weight: 700;
    color: #1a2e1f;
    line-height: 1.35;
  }

  /* ── BOTÕES ── */
  .btn-yellow, .btn-green {
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: var(--fs-btn);
    font-weight: 900;
    cursor: pointer;
    padding: clamp(12px, 2.5vw, 18px) clamp(28px, 5vw, 52px);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    letter-spacing: 0.02em;
  }

  .btn-yellow {
    background: var(--yellow);
    color: #1a2e1f;
    box-shadow: 0 4px 20px rgba(244,208,63,0.35);
  }

  .btn-yellow:hover { filter: brightness(1.07); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(244,208,63,0.45); }

  .btn-green {
    background: var(--green-dark);
    color: #fff;
    box-shadow: 0 4px 20px rgba(44,106,79,0.25);
  }

  .btn-green:hover { filter: brightness(1.12); transform: translateY(-2px); }

  #btn-next {
    display: none;
    margin-top: 4px;
  }

  /* ── TELA DE RESULTADO ── */
  #screen-result {
    display: none;
    width: 100%;
    max-width: min(980px, 100%);
    padding: clamp(20px, 4vw, 40px) clamp(12px, 3vw, 28px);
  }

  .result-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(44,106,79,0.13);
    padding: var(--card-pad);
    text-align: center;
  }

  .result-emoji {
    font-size: clamp(3.5rem, 10vw, 6rem);
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
    line-height: 1;
  }

  .result-title {
    font-family: 'Playfair Display', serif;
    font-size: var(--fs-result-title);
    font-weight: 700;
    color: var(--green-dark);
    margin-bottom: 10px;
  }

  .result-sub {
    font-size: var(--fs-feedback);
    color: #555;
    font-weight: 400;
    margin-bottom: 28px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- TELA INICIAL -->
<section id="screen-start">
  <div class="start-emoji">🪨</div>
  <h1 class="start-title">Quiz de Ciências</h1>
  <p class="start-sub">2º Simulado</p>
  <div class="pills-wrap">
    <span class="pill">Litosfera</span>
    <span class="pill">Rochas Ígneas</span>
    <span class="pill">Rochas Sedimentares</span>
    <span class="pill">Rochas Metamórficas</span>
  </div>
  <button class="btn-yellow" onclick="startQuiz()">▶ Iniciar Quiz</button>
  <p class="start-teacher">Prof. Pierre &nbsp;·&nbsp; Ciências – 6º Ano &nbsp;·&nbsp; Turma</p>
</section>

<!-- BARRA DE PROGRESSO -->
<div id="progress-bar-area">
  <div class="progress-meta">
    <span id="counter-label">Questão 1 de 5</span>
    <span id="right-label">Ciências – 6º Ano</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<!-- TELA QUIZ -->
<section id="screen-quiz">
  <div class="card">
    <p class="topic-label" id="q-topic"></p>
    <p class="question-text" id="q-text"></p>
    <div class="options-grid" id="options-grid"></div>
    <button class="btn-green" id="btn-next" onclick="nextQuestion()">Próxima ▶</button>
  </div>
</section>

<!-- TELA RESULTADO -->
<section id="screen-result">
  <div class="result-card">
    <div class="result-emoji">🎉</div>
    <div class="result-title">Quiz concluído!</div>
    <p class="result-sub">Você respondeu todas as questões.<br>Agora vamos corrigir juntos em sala!</p>
    <button class="btn-yellow" onclick="restartQuiz()">🔄 Tentar Novamente</button>
  </div>
</section>

<script>
const QUESTIONS = [
  {
    topic: "📌 Litosfera",
    question: "O chão que a gente pisa, as montanhas e as pedras fazem parte de uma camada da Terra. Como essa camada se chama?",
    options: [
      "Atmosfera",
      "Litosfera",
      "Hidrosfera",
      "Biosfera"
    ]
  },
  {
    topic: "📌 Rochas Ígneas",
    question: "Lá dentro da Terra tem uma coisa superquente, que parece rocha derretida. Quando ela sai pelo vulcão, como a gente chama ela?",
    options: [
      "Lama",
      "Areia",
      "Lava",
      "Gelo"
    ]
  },
  {
    topic: "📌 Rochas Ígneas",
    question: "Quando a lava do vulcão esfria e endurece, ela vira uma rocha. Que tipo de rocha é essa?",
    options: [
      "Rocha sedimentar",
      "Rocha ígnea",
      "Rocha metamórfica",
      "Rocha de rio"
    ]
  },
  {
    topic: "📌 Rochas Sedimentares",
    question: "Imagine areia e pedrinhas que ficam se juntando no fundo de um rio por muito, muito tempo — até virarem uma rocha. Que rocha é essa?",
    options: [
      "Rocha ígnea",
      "Rocha metamórfica",
      "Rocha sedimentar",
      "Rocha de vulcão"
    ]
  },
  {
    topic: "📌 Rochas Metamórficas",
    question: "Às vezes uma rocha fica presa lá dentro da Terra, onde tem muito calor e muita pressão. Com tudo isso, ela muda e vira outro tipo de rocha. Como essa nova rocha se chama?",
    options: [
      "Rocha sedimentar",
      "Rocha ígnea",
      "Rocha metamórfica",
      "Rocha de areia"
    ]
  }
];

let current = 0;
let answered = false;

function startQuiz() {
  current = 0;
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('progress-bar-area').style.display = 'block';
  document.getElementById('screen-quiz').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = QUESTIONS[current];
  document.getElementById('q-topic').textContent = q.topic;
  document.getElementById('q-text').textContent = q.question;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  const letters = ['A', 'B', 'C', 'D'];
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter-circle">${letters[i]}</span><span class="option-text">${opt}</span>`;
    btn.onclick = () => selectAnswer(btn);
    grid.appendChild(btn);
  });

  document.getElementById('btn-next').style.display = 'none';

  const pct = (current / QUESTIONS.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('counter-label').textContent = `Questão ${current + 1} de 5`;
}

function selectAnswer(btn) {
  if (answered) return;
  answered = true;

  // Marca a alternativa escolhida, sem revelar certo ou errado
  document.querySelectorAll('.option-btn').forEach(b => {
    b.onclick = null;
  });
  btn.classList.add('selected');

  document.getElementById('btn-next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current >= QUESTIONS.length) {
    showResult();
  } else {
    loadQuestion();
  }
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('progress-bar-area').style.display = 'none';
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('screen-result').style.display = 'block';
}

function restartQuiz() {
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('screen-start').style.display = 'flex';
}
</script>
</body>
</html>
