<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Revisão – Ciências 6º Ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --fs-title:        clamp(1.6rem, 5vw, 3rem);
    --fs-sub:          clamp(1rem, 3vw, 1.5rem);
    --fs-topic:        clamp(0.75rem, 2vw, 1rem);
    --fs-question:     clamp(1.1rem, 3.2vw, 1.85rem);
    --fs-option:       clamp(1rem, 2.6vw, 1.45rem);
    --fs-feedback:     clamp(0.9rem, 2.2vw, 1.25rem);
    --fs-btn:          clamp(1rem, 2.8vw, 1.6rem);
    --fs-counter:      clamp(0.85rem, 2vw, 1.1rem);
    --fs-score:        clamp(3rem, 10vw, 5rem);
    --fs-result-title: clamp(1.4rem, 4vw, 2.4rem);
    --fs-stars:        clamp(1.8rem, 5vw, 2.5rem);
    --card-pad:        clamp(20px, 4vw, 48px);
    --gap:             clamp(10px, 2vw, 16px);
    --letter-size:     clamp(34px, 6vw, 44px);
    --green-dark:  #2d6a4f;
    --green-mid:   #52b788;
    --green-light: #d8f3dc;
    --green-ok:    #b7e4c7;
    --yellow:      #f4d03f;
    --red-wrong:   #fce4e4;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1b2b22 0%, #2d6a4f 60%, #52b788 100%);
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px 0;
  }

  /* ── TELA INICIAL ── */
  #screen-start {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    gap: clamp(14px, 3vw, 22px);
    padding: 40px 20px;
    width: 100%;
    max-width: min(980px, 100%);
  }
  .start-emoji {
    font-size: clamp(4rem, 12vw, 7rem);
    animation: float 3s ease-in-out infinite;
    line-height: 1;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-14px); }
  }
  .start-title {
    font-family: 'Playfair Display', serif;
    font-size: var(--fs-title);
    color: #fff;
    line-height: 1.15;
    text-shadow: 0 2px 16px rgba(0,0,0,0.22);
  }
  .start-sub {
    font-size: var(--fs-sub);
    font-weight: 700;
    color: rgba(255,255,255,0.88);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .pills-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 4px;
  }
  .pill {
    background: rgba(255,255,255,0.18);
    border: 1.5px solid rgba(255,255,255,0.35);
    color: #fff;
    font-size: clamp(0.78rem, 2.2vw, 1rem);
    font-weight: 700;
    padding: 6px 16px;
    border-radius: 50px;
    backdrop-filter: blur(4px);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .start-teacher {
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: rgba(255,255,255,0.6);
    font-weight: 400;
  }

  /* ── BARRA DE PROGRESSO ── */
  #progress-bar-area {
    display: none;
    width: 100%;
    max-width: min(980px, 100%);
    padding: clamp(16px, 3vw, 28px) clamp(12px, 3vw, 28px) 0;
  }
  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .progress-meta span {
    font-size: var(--fs-counter);
    font-weight: 700;
    color: rgba(255,255,255,0.92);
  }
  .progress-track {
    width: 100%;
    height: clamp(8px, 1.5vw, 12px);
    background: rgba(255,255,255,0.18);
    border-radius: 50px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 50px;
    transition: width 0.45s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  /* ── CARD QUESTÃO ── */
  #screen-quiz {
    display: none;
    width: 100%;
    max-width: min(980px, 100%);
    padding: clamp(14px, 3vw, 28px) clamp(12px, 3vw, 28px) 0;
  }
  .card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(44,106,79,0.13);
    padding: var(--card-pad);
  }
  .topic-label {
    font-size: var(--fs-topic);
    font-weight: 900;
    color: var(--green-dark);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: clamp(10px, 2vw, 16px);
  }
  .question-text {
    font-size: var(--fs-question);
    font-weight: 700;
    color: #1a2e1f;
    line-height: 1.45;
    margin-bottom: clamp(16px, 3vw, 28px);
  }
  .options-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: var(--gap);
    margin-bottom: clamp(16px, 3vw, 24px);
  }
  @media (min-width: 640px) {
    .options-grid { grid-template-columns: 1fr 1fr; }
  }
  .option-btn {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2vw, 14px);
    background: var(--green-light);
    border: 2.5px solid transparent;
    border-radius: 14px;
    padding: clamp(10px, 2vw, 14px) clamp(12px, 2vw, 18px);
    cursor: pointer;
    text-align: left;
    transition: background 0.22s, border-color 0.22s, transform 0.15s;
    font-family: 'Nunito', sans-serif;
  }
  .option-btn:hover:not(:disabled) {
    background: #c3e6cb;
    transform: translateY(-2px);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct  { background: var(--green-ok);  border-color: #52b788; }
  .option-btn.wrong    { background: var(--red-wrong); border-color: #e57373; }
  .letter-circle {
    min-width: var(--letter-size);
    width: var(--letter-size);
    height: var(--letter-size);
    border-radius: 50%;
    background: var(--green-dark);
    color: #fff;
    font-size: clamp(0.85rem, 2.2vw, 1.15rem);
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.22s;
  }
  .option-btn.wrong .letter-circle { background: #c0392b; }
  .option-text {
    font-size: var(--fs-option);
    font-weight: 700;
    color: #1a2e1f;
    line-height: 1.35;
  }

  /* ── FEEDBACK ── */
  .feedback-box {
    display: none;
    border-radius: 12px;
    padding: clamp(12px, 2.5vw, 18px) clamp(14px, 3vw, 22px);
    margin-bottom: clamp(14px, 3vw, 22px);
    font-size: var(--fs-feedback);
    font-weight: 700;
    line-height: 1.5;
    animation: fadein 0.3s ease;
  }
  @keyframes fadein { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .feedback-box.correct-fb { background: #eafaf1; border: 2px solid #52b788; color: #1a6638; }
  .feedback-box.wrong-fb   { background: #fdf3f3; border: 2px solid #e57373; color: #922b21; }

  /* ── BOTÕES ── */
  .btn-yellow, .btn-green {
    border: none;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: var(--fs-btn);
    font-weight: 900;
    cursor: pointer;
    padding: clamp(12px, 2.5vw, 18px) clamp(28px, 5vw, 52px);
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    letter-spacing: 0.02em;
  }
  .btn-yellow { background: var(--yellow); color: #1a2e1f; box-shadow: 0 4px 20px rgba(244,208,63,0.35); }
  .btn-yellow:hover { filter: brightness(1.07); transform: translateY(-2px); }
  .btn-green  { background: var(--green-dark); color: #fff; box-shadow: 0 4px 20px rgba(44,106,79,0.25); }
  .btn-green:hover  { filter: brightness(1.12); transform: translateY(-2px); }
  #btn-next { display: none; margin-top: 4px; }

  /* ── RESULTADO ── */
  #screen-result {
    display: none;
    width: 100%;
    max-width: min(980px, 100%);
    padding: clamp(20px, 4vw, 40px) clamp(12px, 3vw, 28px);
  }
  .result-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(44,106,79,0.13);
    padding: var(--card-pad);
    text-align: center;
  }
  .result-stars { font-size: var(--fs-stars); margin-bottom: 8px; animation: fadein 0.5s ease; }
  .result-score {
    font-family: 'Playfair Display', serif;
    font-size: var(--fs-score);
    color: var(--green-dark);
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
  }
  .result-title { font-size: var(--fs-result-title); font-weight: 900; color: #1a2e1f; margin-bottom: 18px; }

  /* ── GABARITO ── */
  .gabaret-toggle {
    background: none;
    border: 2px solid var(--green-dark);
    color: var(--green-dark);
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: clamp(0.9rem, 2.2vw, 1.1rem);
    font-weight: 700;
    padding: 9px 22px;
    cursor: pointer;
    margin-bottom: 14px;
    transition: background 0.2s, color 0.2s;
  }
  .gabaret-toggle:hover { background: var(--green-dark); color: #fff; }
  .gabaret-list { display: none; text-align: left; margin-bottom: 20px; }
  .gabaret-list.open { display: block; }
  .gabaret-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    border-bottom: 1px solid #e8f5e9;
    padding: 10px 4px;
    font-size: clamp(0.85rem, 2vw, 1rem);
    color: #1a2e1f;
  }
  .gabaret-item:last-child { border-bottom: none; }
  .gabaret-num  { font-weight: 900; color: var(--green-dark); min-width: 28px; }
  .gabaret-icon { font-size: 1.1em; min-width: 22px; }
  .gabaret-text { font-weight: 700; flex: 1; line-height: 1.4; }
  .gabaret-text span { display: block; font-weight: 400; color: #555; font-size: 0.93em; margin-top: 2px; }
</style>
</head>
<body>

<!-- TELA INICIAL -->
<section id="screen-start">
  <div class="start-emoji">🌍</div>
  <h1 class="start-title">Quiz de Revisão</h1>
  <p class="start-sub">Ciências – 6º Ano</p>
  <div class="pills-wrap">
    <span class="pill">Terra Primitiva</span>
    <span class="pill">Formato & Movimentos</span>
    <span class="pill">Camadas da Terra</span>
    <span class="pill">Biosfera</span>
    <span class="pill">Rochas</span>
    <span class="pill">Solo</span>
  </div>
  <button class="btn-yellow" onclick="startQuiz()">▶ Iniciar Quiz</button>
  <p class="start-teacher">Prof. Pierre &nbsp;·&nbsp; Ciências – 6º Ano &nbsp;·&nbsp; Turma</p>
</section>

<!-- PROGRESSO -->
<div id="progress-bar-area">
  <div class="progress-meta">
    <span id="counter-label">Questão 1 de 15</span>
    <span id="score-label">0 acertos</span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
</div>

<!-- QUIZ -->
<section id="screen-quiz">
  <div class="card">
    <p class="topic-label" id="q-topic"></p>
    <p class="question-text" id="q-text"></p>
    <div class="options-grid" id="options-grid"></div>
    <div class="feedback-box" id="feedback-box"></div>
    <button class="btn-green" id="btn-next" onclick="nextQuestion()">Próxima ▶</button>
  </div>
</section>

<!-- RESULTADO -->
<section id="screen-result">
  <div class="result-card">
    <div class="result-stars" id="result-stars"></div>
    <div class="result-score" id="result-score"></div>
    <div class="result-title" id="result-title"></div>
    <button class="gabaret-toggle" onclick="toggleGabaret()">📋 Ver Gabarito Comentado</button>
    <div class="gabaret-list" id="gabaret-list"></div>
    <button class="btn-yellow" onclick="restartQuiz()">🔄 Tentar Novamente</button>
  </div>
</section>

<script>
const QUESTIONS = [
  // ── 1. TERRA PRIMITIVA ──
  {
    topic: "📌 Terra Primitiva",
    question: "Como era o ar da Terra quando ela acabou de ser formada, há bilhões de anos?",
    options: [
      "Cheio de oxigênio, igual ao ar que respiramos hoje",
      "Feito de gases como vapor d'água e gás carbônico, sem oxigênio",
      "Era só vento frio, sem nenhum gás",
      "Exatamente igual ao ar atual"
    ],
    answer: 1,
    feedback: "O ar da Terra primitiva não tinha oxigênio! Era cheio de vapor d'água, gás carbônico e outros gases. O oxigênio só apareceu muito depois, quando surgiram os primeiros seres vivos que faziam fotossíntese."
  },
  {
    topic: "📌 Terra Primitiva",
    question: "A Terra bem novinha era um lugar bem diferente de hoje. Como ela era?",
    options: [
      "Fria, com muito gelo e neve por todo lado",
      "Cheia de florestas e animais desde o começo",
      "Muito quente, com vulcões e lava por todo lado",
      "Parecida com hoje, mas sem pessoas"
    ],
    answer: 2,
    feedback: "A Terra primitiva era extremamente quente! Meteoros batiam nela o tempo todo e o interior do planeta gerava muito calor. Por isso tinha tantos vulcões e tanta lava — era um lugar bem diferente do que conhecemos hoje."
  },

  // ── 2. FORMATO DA TERRA ──
  {
    topic: "📌 Formato da Terra",
    question: "Qual é o formato real do planeta Terra?",
    options: [
      "Uma bola perfeita e igual em todo lugar",
      "Um quadrado com bordas arredondadas",
      "Quase redonda, mas um pouquinho achatada no topo e na base",
      "Plana como uma mesa"
    ],
    answer: 2,
    feedback: "A Terra parece uma bola, mas não é perfeita! Ela é um pouquinho achatada nos polos (Norte e Sul) e um pouquinho mais grossa na parte do meio, o equador. Esse formato especial tem um nome difícil: geoide."
  },

  // ── 3. MOVIMENTOS DA TERRA ──
  {
    topic: "📌 Movimentos da Terra",
    question: "A Terra gira em volta de si mesma como um pião. Como chamamos esse movimento e o que ele causa?",
    options: [
      "Translação — causa as estações do ano",
      "Rotação — causa o dia e a noite",
      "Rotação — causa as estações do ano",
      "Translação — causa o dia e a noite"
    ],
    answer: 1,
    feedback: "A rotação é a Terra girando em torno de si mesma. Esse giro leva 24 horas — um dia! O lado voltado para o Sol fica claro (dia) e o lado de costas fica escuro (noite)."
  },
  {
    topic: "📌 Movimentos da Terra",
    question: "A Terra também dá uma volta enorme ao redor do Sol. Como chamamos esse movimento e quanto tempo ele leva?",
    options: [
      "Rotação — dura 24 horas",
      "Translação — dura 30 dias",
      "Translação — dura 365 dias (um ano)",
      "Rotação — dura 365 dias"
    ],
    answer: 2,
    feedback: "A translação é a volta da Terra ao redor do Sol. Ela dura cerca de 365 dias — isso é um ano! As horas que sobram a cada ano se acumulam e, a cada 4 anos, temos o ano bissexto, com um dia a mais."
  },
  {
    topic: "📌 Movimentos da Terra",
    question: "Quando é verão no Brasil, o que acontece nos países do hemisfério norte, como a Alemanha?",
    options: [
      "Também é verão, porque a Terra está perto do Sol",
      "É inverno, porque o hemisfério norte está de costas para o Sol",
      "É primavera, porque as estações mudam junto",
      "O tempo é igual nos dois lados da Terra"
    ],
    answer: 1,
    feedback: "As estações do ano são opostas nos dois hemisférios! Quando o Brasil (hemisfério sul) está virado para o Sol — verão —, a Alemanha (hemisfério norte) está de costas para ele — inverno. Isso acontece por causa da inclinação do eixo da Terra."
  },

  // ── 4. CAMADAS DA TERRA ──
  {
    topic: "📌 Camadas da Terra",
    question: "A Terra tem camadas, como uma cebola. Qual é a camada de fora, onde a gente vive?",
    options: [
      "Manto",
      "Núcleo",
      "Crosta",
      "Magma"
    ],
    answer: 2,
    feedback: "A crosta é a camada mais de fora da Terra — é onde ficam o solo, as rochas, os continentes e o fundo dos oceanos. É bem fininha comparada ao tamanho do planeta, mas é onde toda a vida existe!"
  },
  {
    topic: "📌 Camadas da Terra",
    question: "Bem no centro da Terra existe uma camada bem quente e densa. Como ela se chama?",
    options: [
      "Crosta",
      "Manto",
      "Litosfera",
      "Núcleo"
    ],
    answer: 3,
    feedback: "O núcleo fica bem no centro da Terra. Ele é dividido em núcleo externo (líquido) e núcleo interno (sólido). É muito quente e é formado principalmente de ferro e níquel."
  },

  // ── 5. BIOSFERA / ECOSSISTEMA ──
  {
    topic: "📌 Biosfera e Ecossistema",
    question: "Um ecossistema é um lugar onde seres vivos vivem juntos e se relacionam com o ambiente. Quais são as duas partes que formam um ecossistema?",
    options: [
      "Plantas e animais",
      "Parte viva (seres vivos) e parte não viva (sol, água, solo, ar)",
      "Predadores e presas",
      "Floresta e oceano"
    ],
    answer: 1,
    feedback: "Um ecossistema tem dois componentes: a parte biótica (os seres vivos — plantas, animais, fungos, bactérias) e a parte abiótica (o que não é vivo — luz do sol, água, ar, temperatura e solo). Os dois se relacionam o tempo todo!"
  },
  {
    topic: "📌 Biosfera e Ecossistema",
    question: "As plantas conseguem fazer o próprio alimento usando a luz do sol. Por isso elas são chamadas de…",
    options: [
      "Consumidores",
      "Decompositores",
      "Produtores",
      "Predadores"
    ],
    answer: 2,
    feedback: "As plantas são chamadas de produtores porque produzem o próprio alimento através da fotossíntese, usando luz solar, água e gás carbônico. Elas são a base da cadeia alimentar — sem elas, os outros seres não teriam o que comer!"
  },

  // ── 6. ROCHAS MAGMÁTICAS ──
  {
    topic: "📌 Rochas Magmáticas (Ígneas)",
    question: "Quando a lava do vulcão escorre para fora e esfria, ela vira rocha. Como essa rocha é chamada?",
    options: [
      "Rocha sedimentar",
      "Rocha metamórfica",
      "Rocha magmática ou ígnea",
      "Rocha de areia"
    ],
    answer: 2,
    feedback: "Rochas magmáticas (ou ígneas) se formam quando o magma esfria e endurece. Quando isso acontece dentro da Terra, o esfriamento é lento e os cristais ficam grandes. Quando acontece na superfície (lava), o esfriamento é rápido e os cristais ficam pequenos."
  },

  // ── 7. ROCHAS SEDIMENTARES ──
  {
    topic: "📌 Rochas Sedimentares",
    question: "Pedacinhos de areia, lama e conchas se acumulam em rios e mares por milhares de anos e viram rocha. Que rocha é essa?",
    options: [
      "Rocha magmática",
      "Rocha sedimentar",
      "Rocha metamórfica",
      "Rocha de vulcão"
    ],
    answer: 1,
    feedback: "Rochas sedimentares se formam pela acumulação de sedimentos — pedacinhos de areia, argila, cascalho, conchas e até ossos. Com o tempo, esses pedacinhos se comprimem e se colam, formando a rocha. É nessas rochas que a gente encontra fósseis!"
  },
  {
    topic: "📌 Rochas Sedimentares",
    question: "Em qual tipo de rocha é mais provável encontrar fósseis de animais e plantas antigas?",
    options: [
      "Rocha magmática, que vem do vulcão",
      "Rocha metamórfica, que passou por muito calor",
      "Rocha sedimentar, que guarda camadas do passado",
      "Fósseis não ficam guardados em rochas"
    ],
    answer: 2,
    feedback: "Os fósseis ficam guardados nas rochas sedimentares! Isso acontece porque elas se formam camada por camada, e os restos de seres vivos (ossos, conchas, folhas) podem ficar presos entre essas camadas e se preservar por milhões de anos."
  },

  // ── 8. ROCHAS METAMÓRFICAS ──
  {
    topic: "📌 Rochas Metamórficas",
    question: "Uma rocha fica presa fundo na Terra, onde tem muito calor e pressão. Ela muda e vira outro tipo de rocha. Como essa nova rocha se chama?",
    options: [
      "Rocha sedimentar",
      "Rocha magmática",
      "Rocha metamórfica",
      "Rocha de rio"
    ],
    answer: 2,
    feedback: "Rochas metamórficas se formam quando outras rochas sofrem mudanças por causa do calor e da pressão dentro da Terra — mas sem derreter! Um exemplo famoso é o mármore, que é o calcário transformado. O nome 'metamórfica' vem de 'metamorfose', que significa mudança."
  },

  // ── 9. TIPOS DE SOLO ──
  {
    topic: "📌 Tipos de Solo",
    question: "O solo é formado por vários materiais misturados. O que entra na composição do solo?",
    options: [
      "Só areia e pedras",
      "Só água e ar",
      "Minerais, matéria orgânica, água, ar e organismos vivos",
      "Somente magma resfriado"
    ],
    answer: 2,
    feedback: "O solo é bem mais do que terra! Ele é formado por minerais (de rochas quebradas), matéria orgânica (restos de seres vivos em decomposição), água, ar e muitos organismos vivos como minhocas, fungos e bactérias. Tudo isso junto faz o solo ser fértil e cheio de vida."
  },
  {
    topic: "📌 Tipos de Solo",
    question: "Qual tipo de solo é o melhor para as plantas crescerem e para a agricultura?",
    options: [
      "Solo arenoso, porque a água passa rápido",
      "Solo argiloso, porque retém muita água",
      "Solo humoso (ou húmus), rico em matéria orgânica",
      "Solo rochoso, porque é firme e resistente"
    ],
    answer: 2,
    feedback: "O solo humoso, rico em húmus (matéria orgânica), é o melhor para as plantas! Ele tem muitos nutrientes, retém água na medida certa e tem boa estrutura para as raízes crescerem. Por isso solos ricos em húmus são tão valorizados na agricultura."
  }
];

const TOTAL = QUESTIONS.length;
let current = 0, score = 0, userAnswers = [], answered = false;

function startQuiz() {
  current = 0; score = 0; userAnswers = [];
  document.getElementById('screen-start').style.display = 'none';
  document.getElementById('progress-bar-area').style.display = 'block';
  document.getElementById('screen-quiz').style.display = 'block';
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = QUESTIONS[current];
  document.getElementById('q-topic').textContent = q.topic;
  document.getElementById('q-text').textContent = q.question;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  ['A','B','C','D'].forEach((l, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="letter-circle">${l}</span><span class="option-text">${q.options[i]}</span>`;
    btn.onclick = () => selectAnswer(i, btn);
    grid.appendChild(btn);
  });

  const fb = document.getElementById('feedback-box');
  fb.style.display = 'none'; fb.className = 'feedback-box'; fb.innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';

  const pct = (current / TOTAL) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('counter-label').textContent = `Questão ${current + 1} de ${TOTAL}`;
  document.getElementById('score-label').textContent = `${score} acerto${score !== 1 ? 's' : ''}`;
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;

  const q = QUESTIONS[current];
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  const ok = idx === q.answer;
  if (ok) { btn.classList.add('correct'); score++; }
  else     { btn.classList.add('wrong');  buttons[q.answer].classList.add('correct'); }

  userAnswers.push({ chosen: idx, correct: ok });

  const fb = document.getElementById('feedback-box');
  fb.className = 'feedback-box ' + (ok ? 'correct-fb' : 'wrong-fb');
  fb.innerHTML = `${ok ? '✅' : '❌'} ${ok ? '<strong>Correto!</strong> ' : '<strong>Incorreto.</strong> '}${q.feedback}`;
  fb.style.display = 'block';

  document.getElementById('score-label').textContent = `${score} acerto${score !== 1 ? 's' : ''}`;
  document.getElementById('btn-next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  current >= TOTAL ? showResult() : loadQuestion();
}

function showResult() {
  document.getElementById('screen-quiz').style.display = 'none';
  document.getElementById('progress-bar-area').style.display = 'none';
  document.getElementById('screen-result').style.display = 'block';

  const pct = score / TOTAL;
  let stars, title;
  if      (pct === 1)   { stars = '⭐⭐⭐⭐⭐'; title = 'Perfeito! Você arrasou na revisão!'; }
  else if (pct >= 0.8)  { stars = '⭐⭐⭐⭐';   title = 'Excelente! Você está bem preparado!'; }
  else if (pct >= 0.6)  { stars = '⭐⭐⭐';     title = 'Bom! Revise os pontos que errou.'; }
  else if (pct >= 0.4)  { stars = '⭐⭐';       title = 'Ainda dá tempo de revisar mais!'; }
  else                  { stars = '⭐';         title = 'Não desanime! Revise e tente de novo!'; }

  document.getElementById('result-stars').textContent = stars;
  document.getElementById('result-score').textContent = `${score} / ${TOTAL}`;
  document.getElementById('result-title').textContent = title;

  const list = document.getElementById('gabaret-list');
  list.innerHTML = '';
  const letters = ['A','B','C','D'];
  QUESTIONS.forEach((q, i) => {
    const ua = userAnswers[i];
    const item = document.createElement('div');
    item.className = 'gabaret-item';
    item.innerHTML = `
      <span class="gabaret-num">${i+1}.</span>
      <span class="gabaret-icon">${ua.correct ? '✅' : '❌'}</span>
      <span class="gabaret-text">
        Resposta correta: <strong>${letters[q.answer]}) ${q.options[q.answer]}</strong>
        <span>${q.feedback}</span>
      </span>`;
    list.appendChild(item);
  });
}

function toggleGabaret() {
  const list = document.getElementById('gabaret-list');
  list.classList.toggle('open');
  document.querySelector('.gabaret-toggle').textContent =
    list.classList.contains('open') ? '🔼 Ocultar Gabarito' : '📋 Ver Gabarito Comentado';
}

function restartQuiz() {
  document.getElementById('screen-result').style.display = 'none';
  document.getElementById('gabaret-list').classList.remove('open');
  document.querySelector('.gabaret-toggle').textContent = '📋 Ver Gabarito Comentado';
  document.getElementById('screen-start').style.display = 'flex';
}
</script>
